services:
  db:
    image: postgres:16-alpine
    container_name: demo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: blivoai
      POSTGRES_PASSWORD: BlvPg_eZdU18PPULDS4YsemB1CquWN
      POSTGRES_DB: blivoai
    volumes:
      - demo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blivoai -d blivoai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: demo-chatbot
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://blivoai:BlvPg_eZdU18PPULDS4YsemB1CquWN@db:5432/blivoai?schema=public
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-blivoai-demo-secret-2024-change-in-production}
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_API_URL=${LLM_API_URL:-}
      - LLM_MODEL_LIGHT=${LLM_MODEL_LIGHT:-}
      - LLM_MODEL_MEDIUM=${LLM_MODEL_MEDIUM:-}
      - LLM_MODEL_HEAVY=${LLM_MODEL_HEAVY:-}
      - NEXT_PUBLIC_SITE_URL=https://blivoai.com
      - NEXTAUTH_URL=https://blivoai.com
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-blivoai-demo-secret}
      - GOOGLE_CLIENT_ID=107821695568-db4p0elttllbol3q5eg3650q4qbukod2.apps.googleusercontent.com
      - RESEND_API_KEY=re_D5EeMxtR_EbKuGxNfJ6CLDmFXNRmT5sFR
      - CRON_SECRET=${CRON_SECRET:-blivoai-cron-2024}
      - DODO_API_KEY=${DODO_API_KEY:-}
      - DODO_WEBHOOK_SECRET=${DODO_WEBHOOK_SECRET:-}
      - DODO_API_BASE_URL=${DODO_API_BASE_URL:-https://live.dodopayments.com}
      - DODO_IS_LIVE=${DODO_IS_LIVE:-true}
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY:-}
      - PORT=3001
    volumes:
      - demo-uploads:/app/uploads
      - demo-chatbot-data:/app/data
    ports:
      - "3001:3001"
    networks:
      - internal
      - proxy

  caddy:
    image: caddy:2-alpine
    container_name: blivo-caddy
    restart: unless-stopped
    depends_on:
      - app
      - support-app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - proxy

  support-app:
    build:
      context: ./support-blivo
      dockerfile: Dockerfile
    container_name: support-blivo
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://blivoai:BlvPg_eZdU18PPULDS4YsemB1CquWN@db:5432/blivoai?schema=public
      - NODE_ENV=production
      - JWT_SECRET=blivoai-demo-secret-2024-change-in-production
      - PORT=3002
    networks:
      - internal
      - proxy

volumes:
  demo-postgres-data:
  demo-uploads:
  demo-chatbot-data:
  caddy_data:
  caddy_config:

networks:
  internal:
  proxy:
