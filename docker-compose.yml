services:
  db:
    image: postgres:16-alpine
    container_name: blivo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blivoai} -d ${POSTGRES_DB:-blivoai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blivo-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # DATABASE_URL is constructed from POSTGRES_* vars for the db service.
      # Override in .env if connecting to an external database.
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-blivoai}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-blivoai}?schema=public}
      - NODE_ENV=production
      - PORT=3001
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - app-uploads:/app/uploads
      - app-data:/app/data
    networks:
      - internal
      - proxy
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    container_name: blivo-caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - proxy

  # support-app requires ./support-blivo directory with its own Dockerfile.
  # Uncomment this block when support-blivo is available.
  # support-app:
  #   build:
  #     context: ./support-blivo
  #     dockerfile: Dockerfile
  #   container_name: blivo-support
  #   restart: unless-stopped
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   env_file:
  #     - .env
  #   environment:
  #     - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-blivoai}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-blivoai}?schema=public}
  #     - NODE_ENV=production
  #     - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
  #     - PORT=3002
  #   networks:
  #     - internal
  #     - proxy

volumes:
  postgres-data:
  app-uploads:
  app-data:
  caddy_data:
  caddy_config:

networks:
  internal:
  proxy:
