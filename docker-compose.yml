services:
  db:
    image: postgres:16-alpine
    container_name: demo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: blivoai
      POSTGRES_PASSWORD: YOUR_POSTGRES_PASSWORD
      POSTGRES_DB: blivoai
    volumes:
      - demo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blivoai -d blivoai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: demo-chatbot
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set}
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_API_URL=${LLM_API_URL:-}
      - LLM_MODEL_LIGHT=${LLM_MODEL_LIGHT:-}
      - LLM_MODEL_MEDIUM=${LLM_MODEL_MEDIUM:-}
      - LLM_MODEL_HEAVY=${LLM_MODEL_HEAVY:-}
      - NEXT_PUBLIC_SITE_URL=https://blivoai.com
      - NEXTAUTH_URL=https://blivoai.com
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?NEXTAUTH_SECRET must be set}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID must be set}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - CRON_SECRET=${CRON_SECRET:?CRON_SECRET must be set}
      - DODO_API_KEY=${DODO_API_KEY:-}
      - DODO_WEBHOOK_SECRET=${DODO_WEBHOOK_SECRET:-}
      # NOTE: Set DODO_WEBHOOK_SECRET for webhook signature verification. Without it, webhooks are rejected.
      - DODO_API_BASE_URL=${DODO_API_BASE_URL:-https://live.dodopayments.com}
      - DODO_IS_LIVE=${DODO_IS_LIVE:-true}
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY:-}
      - PORT=3001
    volumes:
      - demo-uploads:/app/uploads
      - demo-chatbot-data:/app/data
    ports:
      - "127.0.0.1:3001:3001"
    networks:
      - internal
      - proxy
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    container_name: blivo-caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - proxy

  # NOTE: support-app requires ./support-blivo directory with its own Dockerfile
  # Uncomment this service block if support-blivo is present
  # support-app:
  #   build:
  #     context: ./support-blivo
  #     dockerfile: Dockerfile
  #   container_name: support-blivo
  #   restart: unless-stopped
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   environment:
  #     - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set}
  #     - NODE_ENV=production
  #     - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
  #     - PORT=3002
  #   networks:
  #     - internal
  #     - proxy

volumes:
  demo-postgres-data:
  demo-uploads:
  demo-chatbot-data:
  caddy_data:
  caddy_config:

networks:
  internal:
  proxy:
